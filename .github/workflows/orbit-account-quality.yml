name: Orbit account and workspace quality
on:
  push:
    branches: [main]
    paths:
      - "lib/orbit-auth.ts"
      - "app/api/auth/login/route.ts"
      - "tests/auth-safety.test.mjs"
      - "tests/login-browser.spec.mjs"
      - ".github/workflows/orbit-account-quality.yml"
  workflow_dispatch:
jobs:
  account-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Sign-in validation regression tests
        run: node --experimental-strip-types --test tests/auth-safety.test.mjs
      - name: Existing project regressions
        run: npm run test:projects
      - name: Lint modified login and session code
        run: npx eslint lib/orbit-auth.ts app/api/auth/login/route.ts tests/auth-safety.test.mjs
      - name: Audit pre-existing repository-wide lint blockers
        continue-on-error: true
        run: npm run lint
      - name: Canonical production and offline build
        run: npm run build
      - name: Existing offline preservation regressions
        run: npm run test:offline
      - name: Install pinned Chromium smoke runner
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.58.2
          npx playwright install --with-deps chromium
      - name: Actual Chromium UI states and responsive login smoke
        run: |
          npm run start -- -p 3000 > /tmp/orbit-next.log 2>&1 &
          for i in $(seq 1 45); do if curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi; sleep 2; done
          npx playwright test tests/login-browser.spec.mjs --reporter=line

name: Graphify Knowledge Graph

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "graphify-out/**"
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: graphify-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: python -m pip install "graphifyy"

      - name: Build private deterministic graph
        run: graphify extract . --code-only --force

      - name: Record build metadata
        env:
          GRAPHIFY_SEMANTIC_COMPLETE: "false"
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          graph_path = Path("graphify-out/graph.json")
          graph = json.loads(graph_path.read_text(encoding="utf-8"))
          metadata = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "ref": os.environ["GITHUB_REF"],
              "commit": os.environ["GITHUB_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "semantic_complete": False,
              "source_egress": False,
              "node_count": len(graph.get("nodes", [])),
              "edge_count": len(graph.get("edges", [])),
          }
          Path("graphify-out/BUILD_METADATA.json").write_text(
              json.dumps(metadata, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify graph
        run: |
          test -s graphify-out/graph.json
          test -s graphify-out/manifest.json
          test -s graphify-out/BUILD_METADATA.json
          python -m json.tool graphify-out/graph.json >/dev/null
          python -m json.tool graphify-out/manifest.json >/dev/null
          python -m json.tool graphify-out/BUILD_METADATA.json >/dev/null

      - name: Upload graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: graphify-${{ github.event.repository.name }}-${{ github.sha }}
          path: graphify-out/
          if-no-files-found: error
          retention-days: 90
